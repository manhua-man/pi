      { id: "d3b", x: 630, y: 310, w: 520, h: 86, title: "影响", sub: "coding-agent 更稳健：避免产生无意义的 compaction entry", color: "#8b949e" },
      { id: "d4", x: 60, y: 420, w: 540, h: 86, title: "④ aborted 语义", sub: "agent：显式 err(new CompactionError(\"aborted\"))\ncoding-agent：compaction 摘要路径不处理 aborted（空文本当 summary）；branch-summary 有 aborted 字段", color: "#fbbf24" },
      { id: "d4b", x: 630, y: 420, w: 520, h: 86, title: "影响", sub: "agent 可区分「用户取消」与「失败」；coding-agent 需调用方兜底", color: "#8b949e" },
      { id: "d5", x: 60, y: 530, w: 540, h: 86, title: "⑤ 上下文重建 / 健壮性", sub: "agent：retainedTail 内嵌 + firstKeptEntryId 双路径；\ncollectEntriesForBranchSummary 缺 entry 抛 SessionError；estimateTokens 用 safeJsonStringify\ncoding-agent：仅 firstKeptEntryId；缺 entry 静默 break；裸 JSON.stringify", color: "#fbbf24" },
      { id: "d5b", x: 630, y: 530, w: 520, h: 86, title: "影响", sub: "agent 面向未来迁移（旧 session 无损）；coding-agent 宽松容错", color: "#8b949e" },
    ],
    edges: [],
    detailOf: {
      "d1": ["warn", "findCutPoint 的 token 累计循环：agent 包 `if (entry.type !== \"message\") continue`；coding-agent `sessionEntryToContextMessages(entry).reduce(sum, estimateTokens)` 且仅 `messageTokens===0` 跳过。", "agent:\nfor i in [start,end):\n  if entry.type !== \"message\" continue\n  accumulated += estimateTokens(entry.message)\n\ncoding-agent:\nfor i in [start,end):\n  mt = ctxMessages(entry).reduce(sum·estimate)\n  if mt === 0 continue\n  accumulated += mt"],
      "d2": ["warn", "findTurnStartIndex 的 role 集合不同。agent 包 entry 级 custom_message/branch_summary 走独立 case（算 turn start），但 message 级 custom 不算；coding-agent 全部通过 role 映射。", ""],
      "d5": ["warn", "agent 的 defaultContextEntryTransform：有 retainedTail 时 entries = [compaction] + [compactionIdx+1..end]（跳过 retainedTail 之外的旧 entry）；无 retainedTail 走 firstKeptEntryId。coding-agent sessionEntryToContextMessages(compaction) 只返回 [summaryMessage]。", ""],
    },
  },
};

// ================= 渲染 =================

const svg = document.getElementById("canvas");
const detail = document.getElementById("detail");
const NS = "http://www.w3.org/2000/svg";

let currentView = "arch";
let nodes = [];   // runtime node objects with el refs
let edgesEls = [];
let gx = 0, gy = 0, scale = 1;
let dragging = null; // { type: 'node'|'pan', id?, ox, oy, nx, ny }

const COLORS = {
  "#38bdf8": { stroke: "#38bdf8", fill: "rgba(56,189,248,.10)", text: "#0ea5e9" },
  "#a78bfa": { stroke: "#a78bfa", fill: "rgba(167,139,250,.10)", text: "#8b5cf6" },
  "#34d399": { stroke: "#34d399", fill: "rgba(52,211,153,.10)", text: "#10b981" },
  "#fbbf24": { stroke: "#fbbf24", fill: "rgba(251,191,36,.10)", text: "#d97706" },
  "#f87171": { stroke: "#f87171", fill: "rgba(248,113,113,.10)", text: "#ef4444" },
  "#8b949e": { stroke: "#8b949e", fill: "rgba(139,148,158,.10)", text: "#6e7681" },
};

function clearSvg() {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
}

function makeNodeEl(n) {
  const g = document.createElementNS(NS, "g");
  g.setAttribute("class", "node");
  g.style.cursor = "grab";
  const c = COLORS[n.color] || COLORS["#8b949e"];
  const rect = document.createElementNS(NS, "rect");
  rect.setAttribute("width", n.w);
  rect.setAttribute("height", n.h);
  rect.setAttribute("rx", 8);
  rect.setAttribute("fill", c.fill);
  rect.setAttribute("stroke", c.stroke);
  const title = document.createElementNS(NS, "text");
  title.setAttribute("x", 12); title.setAttribute("y", 20);
  title.setAttribute("class", "t");
  title.textContent = n.title;
  const sub = document.createElementNS(NS, "text");
  sub.setAttribute("x", 12); sub.setAttribute("y", 40);
  sub.setAttribute("class", "s");
  sub.textContent = n.sub || "";
  const sub2 = document.createElementNS(NS, "text");
  sub2.setAttribute("x", 12); sub2.setAttribute("y", 56);
  sub2.setAttribute("class", "s");
  sub2.textContent = n.sub2 || "";
  g.appendChild(rect); g.appendChild(title); g.appendChild(sub); g.appendChild(sub2);
  g.addEventListener("pointerdown", (e) => {
    e.stopPropagation();
    dragging = { type: "node", id: n.id, ox: e.clientX, oy: e.clientY, nx: n.x, ny: n.y };
    g.setPointerCapture(e.pointerId);
  });
  g.addEventListener("click", (e) => {
    e.stopPropagation();
    showDetail(n);
  });
  return g;
}

function makeEdgeEl(edge) {
  const path = document.createElementNS(NS, "path");
  path.setAttribute("class", "edge");
  const col = edge.color || "#444c56";
  path.setAttribute("stroke", col);
  if (edge.dashed) path.setAttribute("stroke-dasharray", "6 4");
  const arrow = document.createElementNS(NS, "path");
  arrow.setAttribute("class", "edge");
  arrow.setAttribute("fill", col);
  arrow.setAttribute("stroke", "none");
  const lbl = document.createElementNS(NS, "text");
  lbl.setAttribute("class", "lbl");
  if (edge.label) lbl.textContent = edge.label;
  return { path, arrow, lbl };
}

function edgePath(x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len, uy = dy / len;
  const sx = x1 + ux * 6, sy = y1 + uy * 6;
  const ex = x2 - ux * 6, ey = y2 - uy * 6;
  const mx = (sx + ex) / 2, my = (sy + ey) / 2;
  const bend = Math.max(14, len * 0.06);
  const nx = -uy, ny = ux;
  const cx = mx + nx * bend * 0.5, cy = my + ny * bend * 0.5;
  return {
    d: `M ${sx} ${sy} Q ${cx} ${cy} ${ex} ${ey}`,
    sx, sy, ex, ey,
    lx: cx, ly: cy,
  };
}

function arrowAt(x1, y1, x2, y2, size = 7) {
  const ang = Math.atan2(y2 - y1, x2 - x1);
  const p1x = x2 - size * Math.cos(ang - 0.42);
  const p1y = y2 - size * Math.sin(ang - 0.42);
  const p2x = x2 - size * Math.cos(ang + 0.42);
  const p2y = y2 - size * Math.sin(ang + 0.42);
  return `M ${x2} ${y2} L ${p1x} ${p1y} L ${p2x} ${p2y} Z`;
}

function render() {
  clearSvg();
  const view = VIEWS[currentView];
  nodes = [];
  edgesEls = [];

  // groups
  for (const grp of view.groups) {
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "groupbox");
    const rect = document.createElementNS(NS, "rect");
    rect.setAttribute("x", grp.x); rect.setAttribute("y", grp.y);
    rect.setAttribute("width", grp.w); rect.setAttribute("height", grp.h);
    rect.setAttribute("rx", 12);
    rect.setAttribute("fill", grp.color === "#38bdf8" ? "var(--group-a)" : grp.color === "#a78bfa" ? "var(--group-b)" : "rgba(251,191,36,.04)");
    rect.setAttribute("stroke", grp.color);
    rect.setAttribute("stroke-opacity", 0.5);
    const lbl = document.createElementNS(NS, "text");
    lbl.setAttribute("x", grp.x + 12); lbl.setAttribute("y", grp.y + 20);
    lbl.setAttribute("class", "glbl");
    lbl.setAttribute("fill", grp.color);
    lbl.textContent = grp.label;
    g.appendChild(rect); g.appendChild(lbl);
    svg.appendChild(g);
  }

  // edges first (behind nodes)
  for (const edge of view.edges) {
    const fromN = view.nodes.find(n => n.id === edge.from);
    const toN = view.nodes.find(n => n.id === edge.to);
    if (!fromN || !toN) continue;
    const f = { x: fromN.x + fromN.w / 2, y: fromN.y + fromN.h / 2 };
    const t = { x: toN.x + toN.w / 2, y: toN.y + toN.h / 2 };
    const ep = edgePath(f.x, f.y, t.x, t.y);
    const els = makeEdgeEl(edge);
    els.path.setAttribute("d", ep.d);
    els.arrow.setAttribute("d", arrowAt(ep.ex - (ep.ex - ep.sx) * 0.08, ep.ey - (ep.ey - ep.sy) * 0.08, ep.ex, ep.ey));
    els.lbl.setAttribute("x", ep.lx + 8);
    els.lbl.setAttribute("y", ep.ly + 16);
    svg.appendChild(els.path);
    svg.appendChild(els.arrow);
    svg.appendChild(els.lbl);
    edgesEls.push({ ...els, from: fromN.id, to: toN.id });
  }

  // nodes
  for (const n of view.nodes) {
    const el = makeNodeEl(n);
    el.setAttribute("transform", `translate(${n.x}, ${n.y})`);
    svg.appendChild(el);
    nodes.push({ ...n, el });
  }

  // hover highlight
  for (const nd of nodes) {
    nd.el.addEventListener("pointerenter", () => highlight(nd.id, true));
    nd.el.addEventListener("pointerleave", () => highlight(nd.id, false));
  }

  applyRoot();
}

function highlight(id, on) {
  const view = VIEWS[currentView];
  for (const e of edgesEls) {
    const rel = e.from === id || e.to === id;
    const cls = on && rel ? "edge hl" : "edge";
    e.path.setAttribute("class", cls);
    e.arrow.setAttribute("class", cls);
    if (on && rel) {
      e.path.setAttribute("stroke-opacity", 1);
    } else if (!on) {
      e.path.removeAttribute("stroke-opacity");
    }
  }
}

function showDetail(n) {
  const view = VIEWS[currentView];
  const spec = (view.detailOf && view.detailOf[n.id]);
  detail.innerHTML = "";
  const badgeKind = n.color === "#fbbf24" ? "b-warn" : n.color === "#f87171" ? "b-danger" : (n.color === "#38bdf8" ? "b-agent" : n.color === "#a78bfa" ? "b-coding" : "b-warn");
  const badgeTxt = n.color === "#38bdf8" ? "agent harness" : n.color === "#a78bfa" ? "coding-agent" : n.color === "#fbbf24" ? "差异 / 关键点" : "数据流";
  let html = `<span class="badge ${badgeKind}">${badgeTxt}</span><h3>${n.title}</h3>`;
  html += `<div><span class="k">定位：</span><span class="v">${n.sub || "—"}</span></div>`;
  if (n.sub2) html += `<div><span class="k">补充：</span><span class="v">${n.sub2}</span></div>`;
  if (spec) {
    const [, desc, code] = spec;
    html += `<div class="note">${desc}</div>`;
    if (code) html += `<div class="code">${code}</div>`;
  } else {
    html += `<div class="note">节点信息已展示，可拖动调整位置。</div>`;
  }
  detail.innerHTML = html;
}

// ================= 交互 =================

svg.addEventListener("pointerdown", (e) => {
  if (e.target === svg) {
    dragging = { type: "pan", ox: e.clientX, oy: e.clientY, gx, gy };
    svg.setPointerCapture(e.pointerId);
  }
});

svg.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  if (dragging.type === "node") {
    const dx = (e.clientX - dragging.ox) / scale;
    const dy = (e.clientY - dragging.oy) / scale;
    const n = nodes.find(x => x.id === dragging.id);
    if (n) {
      n.x = dragging.nx + dx;
      n.y = dragging.ny + dy;
      n.el.setAttribute("transform", `translate(${n.x}, ${n.y})`);
      updateEdges();
    }
  } else if (dragging.type === "pan") {
    gx = dragging.gx + (e.clientX - dragging.ox);
    gy = dragging.gy + (e.clientY - dragging.oy);
    applyRoot();
  }
});

svg.addEventListener("pointerup", () => { dragging = null; });

svg.addEventListener("wheel", (e) => {
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  const mx = e.clientX - rect.left - gx;
  const my = e.clientY - rect.top - gy;
  const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  const ns = Math.min(2.2, Math.max(0.35, scale * factor));
  gx = e.clientX - rect.left - mx * (ns / scale);
  gy = e.clientY - rect.top - my * (ns / scale);
  scale = ns;
  applyRoot();
}, { passive: false });

function applyRoot() {
  const inner = svg.querySelector("g#root");
  if (!inner) {
    const r = document.createElementNS(NS, "g");
    r.setAttribute("id", "root");
    while (svg.firstChild) r.appendChild(svg.firstChild);
    svg.appendChild(r);
  }
  const r = svg.querySelector("g#root");
  r.setAttribute("transform", `translate(${gx}, ${gy}) scale(${scale})`);
}

function updateEdges() {
  const view = VIEWS[currentView];
  const byId = {};
  for (const n of nodes) byId[n.id] = n;
  let i = 0;
  for (const edge of view.edges) {
    const f = byId[edge.from], t = byId[edge.to];
    if (!f || !t) { i++; continue; }
    const ep = edgePath(f.x + f.w / 2, f.y + f.h / 2, t.x + t.w / 2, t.y + t.h / 2);
    const els = edgesEls[i++];
    if (!els) continue;
    els.path.setAttribute("d", ep.d);
    els.arrow.setAttribute("d", arrowAt(ep.ex - (ep.ex - ep.sx) * 0.08, ep.ey - (ep.ey - ep.sy) * 0.08, ep.ex, ep.ey));
    els.lbl.setAttribute("x", ep.lx + 8);
    els.lbl.setAttribute("y", ep.ly + 16);
  }
}

// ================= tab =================

document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentView = btn.dataset.view;
    gx = 20; gy = 10; scale = 1;
    render();
    detail.innerHTML = `<div style="color:var(--muted);font-size:12px;text-align:center;margin-top:40%">点击任意节点查看细节说明</div>`;
  });
});

render();
</script>
</body>
</html>
